[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-workflow-compiler"
dynamic = ["version"]
description = "Compile agent-written ComfyUI API graphs into native, grouped, documented canvas workflows"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
oracle = ["playwright>=1.40"]

[project.scripts]
cwc = "cwc.cli:main"

[tool.setuptools.dynamic]
version = { attr = "cwc.__version__" }

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cwc*"]

[tool.setuptools.package-data]
"cwc.data" = ["*.json"]
