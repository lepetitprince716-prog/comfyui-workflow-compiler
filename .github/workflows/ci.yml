name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces the run of the older one. Runs on main are
# never cancelled: every commit there gets a finished result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.10", "3.14"] # the two ends of the supported range
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -B -m unittest discover -s tests

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff==0.15.16
      - name: Ruff
        run: ruff check src tests tools guard_tests
      - name: No node type names in src/cwc
        run: python -B tools/lint_no_node_names.py

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheel" .
      - name: Install it into a fresh environment outside the checkout
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/wheel/*.whl
      - name: Compile a minimal graph with the installed command
        run: |
          set -euo pipefail
          # The graph comes from the checkout, the command from the wheel: the
          # checkout's src/ is on the path only for the one line that writes the graph.
          PYTHONPATH=src:. python -B -c "import json; from tests.graphs import txt2img; print(json.dumps(txt2img()))" > "$RUNNER_TEMP/txt2img.json"
          cd "$RUNNER_TEMP"
          venv/bin/cwc --help
          venv/bin/cwc compile txt2img.json -o compiled
          test -s compiled/txt2img.ui.json
          test -s compiled/txt2img.api.json

  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the scan reads the whole history
          persist-credentials: false
      - name: Privacy scan of the tree and the whole history
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          scanner=tools/privacy_scan.py
          rules=tools/privacy_rules.json
          if [ -n "$BASE_REF" ]; then
            # On a pull request the scanner and its rules come from the base branch, so a
            # change to them cannot weaken the check that judges it. A change to this
            # workflow file still can: review any pull request that touches it.
            # The full ref name is used on purpose: a tag called origin/<base> would win over
            # the short name origin/<base> and could stand in for the base branch.
            if ! git show-ref --verify --quiet "refs/remotes/origin/$BASE_REF"; then
              echo "base branch refs/remotes/origin/$BASE_REF not found: the scan has no trusted copy of its scanner" >&2
              exit 1
            fi
            git show "refs/remotes/origin/$BASE_REF:tools/privacy_scan.py" > "$RUNNER_TEMP/privacy_scan.py"
            git show "refs/remotes/origin/$BASE_REF:tools/privacy_rules.json" > "$RUNNER_TEMP/privacy_rules.json"
            scanner="$RUNNER_TEMP/privacy_scan.py"
            rules="$RUNNER_TEMP/privacy_rules.json"
          fi
          python3 -I -B "$scanner" --rules "$rules" --tracked --history

  betterleaks:
    # The second scan, for keys and tokens: Betterleaks over the whole history. The same
    # wrapper runs in the local hooks (PRIVACY.md, "Second scan: Betterleaks").
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Linux x64 asset of the v1.10.1 release. The digest is the one the GitHub release API
      # lists for the asset; it matches the release's checksums.txt (read 2026-11-18).
      BETTERLEAKS_VERSION: "1.10.1"
      BETTERLEAKS_ARCHIVE: betterleaks_1.10.1_linux_x64.tar.gz
      BETTERLEAKS_SHA256: c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the scan reads the whole history
          persist-credentials: false
      - name: Take the scan wrapper from the base branch on a pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/secret_scan"
          if [ -n "$BASE_REF" ]; then
            # Same reason as in the privacy job: a pull request cannot weaken the wrapper
            # and the report template that judge it. Full ref name, so a tag cannot stand in.
            if ! git show-ref --verify --quiet "refs/remotes/origin/$BASE_REF"; then
              echo "base branch refs/remotes/origin/$BASE_REF not found: the scan has no trusted copy of its wrapper" >&2
              exit 1
            fi
            git show "refs/remotes/origin/$BASE_REF:tools/secret_scan.sh" > "$RUNNER_TEMP/secret_scan/secret_scan.sh"
            git show "refs/remotes/origin/$BASE_REF:tools/secret_scan.tmpl" > "$RUNNER_TEMP/secret_scan/secret_scan.tmpl"
          else
            cp tools/secret_scan.sh tools/secret_scan.tmpl "$RUNNER_TEMP/secret_scan/"
          fi
      - name: Install Betterleaks (pinned version, checked against the hash above)
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$BETTERLEAKS_ARCHIVE" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${BETTERLEAKS_ARCHIVE}"
          echo "${BETTERLEAKS_SHA256}  ${RUNNER_TEMP}/${BETTERLEAKS_ARCHIVE}" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$BETTERLEAKS_ARCHIVE" -C "$RUNNER_TEMP/bin" betterleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Show the installed version
        run: betterleaks version
      - name: Scan history for secrets
        run: sh "$RUNNER_TEMP/secret_scan/secret_scan.sh" history
      - name: Test the secret guard
        run: python3 -I -B -m unittest discover -s guard_tests
